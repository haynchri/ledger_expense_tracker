{% extends "tracker/base.html" %}
{% block title %}Delete {{ type }}{% endblock %}

{% block content %}
<div class="delete-shell">
  <div class="card delete-card">
    <div class="delete-emoji">⚠️</div>
    <h2 class="delete-title">Delete {{ type }}?</h2>
    <p class="delete-message">
      Are you sure you want to delete <strong>{{ obj }}</strong>?
      This action cannot be undone.
    </p>
    <form method="post" class="delete-form">
      {% csrf_token %}
      <a href="javascript:history.back()" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
    </form>
  </div>
</div>
{% endblock %}
